# Образец: та же пара «веб-сервер и база», но написанная так, чтобы проверка молчала.
# `doctor check examples` — ни одного замечания.
services:
  web:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      база:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  база:
    image: postgres:16.4-alpine
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - данные:/var/lib/postgresql/data

volumes:
  данные:
